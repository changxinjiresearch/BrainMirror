name: SCEPT A6-IJ-04C full tensor observational audit contracts

on:
  workflow_dispatch:
  push:
    branches:
      - phase/scept-sdk-a6-m5-release-qualification
    paths:
      - 'scept_sdk/examples/a6_ij_04c*.py'
      - 'scept_sdk/tests/test_a6_ij_04c_full_contract.py'
      - '.github/workflows/scept_a6_ij_04c_synthetic.yml'
  pull_request:
    paths:
      - 'scept_sdk/examples/a6_ij_04c*.py'
      - 'scept_sdk/tests/test_a6_ij_04c_full_contract.py'
      - '.github/workflows/scept_a6_ij_04c_synthetic.yml'

permissions:
  contents: read

jobs:
  full-tensor-integrity-and-scientific-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest (NO original patient data)
        run: python -m pip install -q 'pytest>=7'
      - name: Confirm 04C01 / 04C02 and seven-source final gate source contracts
        run: python -m pytest -q -s scept_sdk/tests/test_a6_ij_04c_full_contract.py
