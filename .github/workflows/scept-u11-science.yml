name: SCEPT U11 Scientific Validation - Real Pretrained MNIST
on:
  push:
    branches:
      - "phase/scept-u11-**"
      - main
    paths:
      - "scripts/u11_real_mnist_benchmark.py"
      - "scripts/u11_make_research_figures.py"
      - "tests/test_u11_registered_real_benchmark.py"
      - "docs/SCEPT_U11_PREREGISTRATION_V0_1.md"
      - ".github/workflows/scept-u11-science.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scept-u11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-mnist-pilot:
    name: Preregistered authentic ONNX/MNIST 20-case source and arithmetic acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU-only pinned scientific Python/ONNX Runtime
        run: python -m pip install numpy==2.2.6 onnxruntime==1.23.2
      - name: Pre-data unit falsification, failures and statistical boundary checks
        run: python -m unittest discover -s tests -p 'test_u11_registered_real_benchmark.py' -v
      - name: Independent scientific Python vs actual U10 trusted JS plugin nuisance and dose parity
        run: |
          node tests/u11_js_python_parity.cjs > /tmp/scept-u11-u10-js-numeric.json
          python - <<'PY'
          import importlib.util, json, numpy as np
          spec=importlib.util.spec_from_file_location('b','scripts/u11_real_mnist_benchmark.py')
          b=importlib.util.module_from_spec(spec);spec.loader.exec_module(b)
          observed=json.load(open('/tmp/scept-u11-u10-js-numeric.json'))
          original=np.asarray(observed['original'],dtype=np.float32)
          z=b.u10_noise(original,109,.001)
          for result in observed['results']:
              q=result['dose']
              expected_b=b.occlude(z,np.array([0,1],dtype=np.intp),q)
              expected_c=b.occlude(z,np.array([6,7],dtype=np.intp),q)
              np.testing.assert_allclose(result['A'],original,atol=0,rtol=0)
              np.testing.assert_allclose(result['B'],expected_b,atol=1e-7,rtol=0)
              np.testing.assert_allclose(result['C'],expected_c,atol=1e-7,rtol=0)
          print('PASS actual U10 JS intervention vs standalone Python preregistered benchmark numerical nuisance/ROI parity')
          PY
      - name: Real pretrained model + original MNIST test IDX pilot (2 per digit, 20 true images)
        run: |
          python scripts/u11_real_mnist_benchmark.py \
            --mode pilot --out results/u11/pilot \
            --cache /tmp/scept-u11-original-sources
      - name: Archive original numeric results and provenance - NOT raw test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scept-u11-pilot-real-mnist
          path: results/u11/pilot/
          if-no-files-found: warn
          retention-days: 90

  full-registered-study:
    name: Frozen 100-case original MNIST test, negative controls and paired corrected statistics
    needs: real-mnist-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU-only pinned packages
        run: python -m pip install numpy==2.2.6 onnxruntime==1.23.2 matplotlib==3.10.5
      - name: Execute fully preregistered authentic MNIST-12 100-case scientific run
        run: |
          python scripts/u11_real_mnist_benchmark.py \
            --mode main --out results/u11/main \
            --cache /tmp/scept-u11-original-sources
      - name: Validate results schema, registered original cohort and no untruthful claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/u11/main/summary.json').read_text())
          assert r['data']['n']==100
          assert len(r['data']['selected_original_indices'])==100
          assert r['model']['sha256']=='5c688690f8bacf667d4c2074af5ad0646ca328d7ab03eccf944a65b320171bdd'
          assert r['claims']['clinical']=='NOT_ESTABLISHED'
          assert r['claims']['outperforms_all_xai']=='NOT_ESTABLISHED'
          assert r['statistics']['n_primary']==r['data']['n_correct']-sum(
              1 for x in json.loads(Path('results/u11/main/cases.json').read_text())
              if x['correct'] and not x['usable_primary'])
          assert r['quality']['all_zero_dose_verified']
          assert len(r['statistics']['comparisons'])==6 if r['statistics']['n_primary']>0 else True
          print('PASSED main real scientific provenance/schema; quality:',r['quality']['quality_gate'])
          PY
      - name: Render publication-quality plots FROM immutable original numeric study records
        run: |
          python scripts/u11_make_research_figures.py             --summary results/u11/main/summary.json             --cases results/u11/main/cases.json             --out results/u11/main/figures
      - name: Independently check every real U10 B/C matched control after exact seeded nuisance
        run: |
          python scripts/u11_protocol_audit.py             --cases results/u11/main/cases.json             --assets /tmp/scept-u11-original-sources             --out results/u11/main/u10_matching_parity.json
      - name: Independent full second run with exact same frozen model/data and protocol
        run: |
          python scripts/u11_real_mnist_benchmark.py             --mode main --out results/u11/independent-replay             --cache /tmp/scept-u11-original-sources > /tmp/scept-u11-replay.log
          python - <<'PY'
          from pathlib import Path
          import json
          import hashlib
          a=Path('results/u11/main/cases.json').read_bytes()
          b=Path('results/u11/independent-replay/cases.json').read_bytes()
          assert a==b, 'REPLAY_DIVERGENCE: independent second 100-case actual ONNX execution differs'
          x=json.loads(Path('results/u11/main/summary.json').read_text())
          y=json.loads(Path('results/u11/independent-replay/summary.json').read_text())
          for k in ('model','data','design','quality','statistics','claims'):
              assert x[k]==y[k],f'REPLAY_DIVERGENCE: {k}'
          Path('results/u11/main/replay_integrity.json').write_text(json.dumps({
              'schema':'scept.u11.independent-replay.v1',
              'actual_second_onnx_execution':True,
              'case_json_sha256':hashlib.sha256(a).hexdigest(),
              'case_records_equal':True,
              'statistics_equal':True,
              'n_cases':x['data']['n'],
              'source_hashes':x['data']['source_hashes'],
              'scientific_effect_replicated_across_new_data':'NOT_TESTED'},indent=2)+'\n')
          print('PASS U11 exact independent 100-case rerun, authentic ONNX and original MNIST')
          PY
      - name: Persist versioned scientific results as permanent GitHub repository files
        if: github.ref == 'refs/heads/phase/scept-u11-registered-real-data-benchmark'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/u11/registered-v0.1
          cp results/u11/main/summary.json              results/u11/main/cases.json              results/u11/main/cases.csv              results/u11/main/replay_integrity.json              results/u11/main/u10_matching_parity.json              results/u11/registered-v0.1/
          cp -r results/u11/main/figures results/u11/registered-v0.1/figures
          (cd results/u11/registered-v0.1 && find . -type f ! -name FILE_HASHES.sha256 -print0 | sort -z | xargs -0 sha256sum > FILE_HASHES.sha256)
          git config user.name "scept-research-bot"
          git config user.email "scept-research-bot@users.noreply.github.com"
          git add results/u11/registered-v0.1/
          if ! git diff --cached --quiet; then
            git commit -m "results(u11): preserve preregistered 100 real MNIST test case results and independent replay"
            git push origin HEAD:phase/scept-u11-registered-real-data-benchmark
          fi
      - name: Archive 100-case aggregate, case diagnostics, mask matching and actual numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scept-u11-main-real-mnist-frozen-v01
          path: results/u11/main/
          if-no-files-found: warn
          retention-days: 90
