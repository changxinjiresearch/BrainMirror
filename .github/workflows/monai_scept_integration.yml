name: SCEPT MONAI SwinUNETR Integration (CPU)
on:
  push:
    branches: ['phase/**']
    paths:
      - 'brainmirror/scept/monai_*.py'
      - 'brainmirror/scept/brats*.py'
      - 'tests/test_brats_v09*.py'
      - 'tests/test_brats_r1*.py'
      - 'scripts/scept_brats_v09*.py'
      - 'tests/test_monai_integration_v07.py'
      - 'tests/test_scept_monai_crosslayer_v08.py'
      - 'brainmirror/scept/monai_crosslayer.py'
      - 'scripts/monai_v08_smoke.py'
      - '.github/workflows/monai_scept_integration.yml'
  pull_request:
    paths:
      - 'brainmirror/scept/monai_*.py'
      - 'brainmirror/scept/brats*.py'
      - 'tests/test_brats_v09*.py'
      - 'tests/test_brats_r1*.py'
      - 'scripts/scept_brats_v09*.py'
      - 'tests/test_monai_integration_v07.py'
      - 'tests/test_scept_monai_crosslayer_v08.py'
      - 'brainmirror/scept/monai_crosslayer.py'
      - 'scripts/monai_v08_smoke.py'
      - '.github/workflows/monai_scept_integration.yml'
permissions:
  contents: read
jobs:
  official-monai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official MONAI and CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.3,<3' 'monai==1.5.1' 'pytest>=8,<10' 'numpy>=1.26,<3' 'einops>=0.7,<1' 'nibabel>=5.3,<6'
      - name: Verify installed MONAI version
        run: |
          python -c 'import torch,monai;print("torch",torch.__version__,"monai",monai.__version__)'
      - name: Run real-library SwinUNETR tests (skipping is forbidden)
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q -rs tests/test_monai_integration_v07.py
          PYTHONPATH=. python scripts/monai_v07_smoke.py --json-out /tmp/monai-v07-result.json
          PYTHONPATH=. python scripts/monai_v08_smoke.py --json-out /tmp/monai-v08-result.json
          python -m pytest -q -rs tests/test_brats_v09.py tests/test_brats_v09_monai.py tests/test_brats_r1_trainer.py tests/test_brats_r1_monai.py
          PYTHONPATH=. python -m scripts.scept_r1_resume_smoke --output /tmp/scept-v09-R1-SYNTHETIC-resume.json
          PYTHONPATH=. python scripts/scept_brats_v09_synthetic_smoke.py --json-out /tmp/scept-brats-v09-SYNTHETIC.json
      - name: Upload synthetic engineering audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monai-v07-synthetic-audit
          path: |
            /tmp/monai-v07-result.json
            /tmp/monai-v08-result.json
          if-no-files-found: ignore

      - name: Upload BraTS v0.9 engineering smoke (SYNTHETIC, NO PATIENT DATA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scept-brats-v09-SYNTHETIC-not-medical-evidence
          path: /tmp/scept-brats-v09-SYNTHETIC.json
          if-no-files-found: ignore

      - name: Upload synthetic R1 resume audit (NO PATIENT DATA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scept-v09-R1-SYNTHETIC-resume
          path: /tmp/scept-v09-R1-SYNTHETIC-resume.json
          if-no-files-found: ignore
