name: SCEPT A6-IJ-04D actual synthetic activation patch scientific gate

on:
  workflow_dispatch:
  push:
    branches: ['phase/scept-sdk-a6-m5-release-qualification']
    paths:
      - 'scept_sdk/examples/a6_ij_04d*.py'
      - 'scept_sdk/tests/test_a6_ij_04d_synthetic.py'
      - 'scept_sdk/tests/test_a6_ij_04d_original_contract.py'
      - '.github/workflows/scept_a6_ij_04d_synthetic.yml'
  pull_request:
    paths:
      - 'scept_sdk/examples/a6_ij_04d*.py'
      - 'scept_sdk/tests/test_a6_ij_04d_synthetic.py'
      - '.github/workflows/scept_a6_ij_04d_synthetic.yml'

permissions:
  contents: read

jobs:
  frozen-computational-causal-intervention:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU Torch/numpy/pytest only (NO MRI)
        run: python -m pip install -q 'torch>=2.2,<3' 'numpy>=1.24,<3' 'pytest>=7'
      - name: Run frozen synthetic direct graph patch test
        run: python -m pytest -q -s scept_sdk/tests/test_a6_ij_04d_synthetic.py scept_sdk/tests/test_a6_ij_04d_original_contract.py
      - name: Scope
        run: echo 'Synthetic computation only. No patient/model P4 Kaggle outcome implied.'
