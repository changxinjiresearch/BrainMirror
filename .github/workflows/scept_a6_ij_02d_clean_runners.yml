name: SCEPT A6-IJ-02D — fresh runner cross-architecture and ONNX parity

on:
  pull_request:
    paths:
      - 'scept_sdk/**'
      - '.github/workflows/scept_a6_ij_02d_clean_runners.yml'
  push:
    branches:
      - 'phase/scept-sdk-a6-m5-release-qualification'
    paths:
      - 'scept_sdk/**'
      - '.github/workflows/scept_a6_ij_02d_clean_runners.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  separate-clean-linux-python-runners:
    name: real synthetic replay / python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK and actual PyTorch/ONNX runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './scept_sdk[all]' 'pytest>=7' 'onnxscript>=0.1'
      - name: Test two architectures, exact direct hooks, and PyTorch versus ONNX CPU
        env:
          SCEPT_02D_REPORT: ${{ runner.temp }}/a6_ij_02d_python_${{ matrix.python-version }}.json
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q -s scept_sdk/tests/test_a6_ij_02d_crossruntime.py
      - name: Upload environment-specific replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scept-02d-clean-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/a6_ij_02d_python_${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 30
