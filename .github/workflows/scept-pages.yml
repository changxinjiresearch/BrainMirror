name: SCEPT Universal Core V1 - free GitHub Pages publish
on:
  workflow_run:
    workflows: ["SCEPT Browser Engine Acceptance"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/scept-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: scept-universal-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout the tested same-repository main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - name: Verify essential browser artifacts
        shell: bash
        run: |
          test -f scept-web/universal.html
          test -f scept-web/v4.html
          test -f scept-web/v5.html
          test -f scept-web/scept_v5_science.js
          test -f scept-web/scept_v5_ui.js
          test -f scept-web/scept_v4_ceds.js
          test -f scept-web/core/scept_sdk.js
          test -f scept-web/core/scept_audit.js
          test -f scept-web/scept_m3_console.js
          test -f scept-web/core/scept_performance.js
          echo "Only versioned browser assets are published; no model datasets or raw MRI files."
      - name: Configure existing GitHub Pages (owner must first select Actions source in Settings -> Pages)
        uses: actions/configure-pages@v5
      - name: Stage Universal Core V1 as home and preserve old Transformer demo
        shell: bash
        run: |
          cp scept-web/index.html scept-web/legacy-studio.html
          python - <<'PY'
          from pathlib import Path
          root=Path("scept-web")
          landing='''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=./v5.html">
          <title>SCEPT V5 - Neural Fingerprint</title></head><body><main>
          <h1>SCEPT V5 / Neural Difference Fingerprint</h1>
          <p><a href="./v5.html">Open SCEPT V5 Counterfactual Neural Observatory</a></p>
          <p><a href="./v4.html">Previous v4 CEDS observatory</a></p>
          <p><a href="./universal.html">Universal Core advanced research console</a></p>
          <p><a href="./legacy-studio.html">Legacy Transformer demonstration</a></p>
          </main></body></html>'''
          (root/"index.html").write_text(landing,encoding="utf-8")
          universal=root/"universal.html"
          universal.write_text(universal.read_text(encoding="utf-8").replace(
            'href="./index.html"','href="./legacy-studio.html"'),encoding="utf-8")
          PY
      - name: Upload static SCEPT website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: scept-web
      - name: Publish tested static browser assets
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify public Universal V1 HTTP artifact
        shell: bash
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 --max-time 30 \
            --output "$RUNNER_TEMP/scept-public-universal.html" \
            "${PAGE_URL%/}/v5.html"
          grep --fixed-strings --quiet 'scept_v5_science.js' "$RUNNER_TEMP/scept-public-universal.html"
          grep --fixed-strings --quiet 'v5Fingerprint' "$RUNNER_TEMP/scept-public-universal.html"
          echo "PASS actual public V5 NDF MRI / 3D site downloaded entirely and verified"

  verify-public-on-workflow-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify existing deployed U11 workbench with complete HTTP transfer, no broken pipe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 --max-time 30 \
            --output "$RUNNER_TEMP/scept-public-universal.html" \
            "https://changxinjiresearch.github.io/BrainMirror/universal.html"
          grep --fixed-strings --quiet 'SCEPT Universal Core' "$RUNNER_TEMP/scept-public-universal.html"
          grep --fixed-strings --quiet 'M4 尚未通过' "$RUNNER_TEMP/scept-public-universal.html"
          echo "PASS live U11 scientific status is truthful and publicly reachable"
