name: SCEPT V6.5 Universal Research Workspace
on:
  pull_request:
    paths:
      - "scept-web/**"
      - "scept_sdk/**"
      - ".github/workflows/scept-v65.yml"
      - ".github/workflows/scept-pages.yml"
      - "docs/SCEPT_V6_5_WORKSPACE_RELEASE.md"
  push:
    branches: [main]
    paths:
      - "scept-web/**"
      - ".github/workflows/scept-v65.yml"
      - ".github/workflows/scept-pages.yml"
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail-closed local-only journal scientific contract
        run: |
          node --check scept-web/core/scept_workspace_journal.js
          node --check scept-web/scept_workspace_v65.js
          node --check scept-web/core/scept_cloud_orbit.js
          node scept-web/tests/v65_cloud_orbit_contract.cjs
          node --check scept-web/scept_v6_ui.js
          node --check scept-web/core/scept_full_archive.js
          node --check scept-web/core/scept_capture_once.js
          node --check scept-web/tests/v65_full_archive_contract.cjs
          node scept-web/tests/v65_full_archive_contract.cjs
          python scept-web/tests/verify_full_archive.py /tmp/scept-full-archive-contract.zip
          node scept-web/tests/v65_workspace_contract.cjs
          node scept-web/tests/v6_23_naf_contract.cjs
      - name: Install genuine Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve actual static project
        run: |
          python -m http.server 8765 -d scept-web >/tmp/scept-v65-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/v6.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Browser actual ViT NAF, historical journal, import/export and routes
        run: node scept-web/tests/v65_workspace_browser.cjs
      - name: Preserve V6.2 and V6.3 measured observation behavior
        run: node scept-web/tests/v6_23_naf_browser.cjs
      - name: Independent real ViT ZIP integrity verification
        run: |
          python scept-web/tests/verify_full_archive.py /tmp/scept-real-vit-full-observation.zip
          python scept-web/tests/verify_full_archive.py /tmp/scept-real-vit-with-input.zip
      - name: A5 independent Python SDK import of REAL pretrained ViT browser-observation archives
        run: |
          python -m pip install 'numpy>=1.24,<3'
          PYTHONPATH=scept_sdk python - <<'PY'
          from scept import load_observation
          from pathlib import Path
          plain=load_observation('/tmp/scept-real-vit-full-observation.zip')
          retained=load_observation('/tmp/scept-real-vit-with-input.zip')
          assert plain.record['schema']=='scept.run-record.v1'
          assert len(plain.tensors)>=5
          assert plain.input_names==()
          assert len(retained.tensors)>=5
          assert len(retained.input_names)>0
          assert sum(len(g['units']) for g in plain.recompute_naf()['groups'])>=985
          assert plain.recompute_naf()['science']['model_forward_reexecuted'] is False
          print('PASS A5 real browser public ViT: Python independent import, 985+ NAF units, optional actual input and SHA')
          PY
      - name: Public-release visual acceptance screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scept-v65-real-research-workspace
          path: /tmp/scept-v65-workspace-actual.png
          if-no-files-found: ignore
