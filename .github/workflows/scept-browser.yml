name: SCEPT Browser Engine Acceptance
on:
  push:
    branches: [main, "phase/**", "fix/**"]
    paths:
      - "scept-web/**"
      - "scripts/expose_onnx_probes.py"
      - ".github/workflows/scept-browser.yml"
  pull_request:
    paths:
      - "scept-web/**"
      - "scripts/expose_onnx_probes.py"
permissions:
  contents: read
jobs:
  numeric-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend syntax
        run: |
          node --check scept-web/core/scept_core.js
          node --check scept-web/core/onnx_probes.js
          node --check scept-web/core/onnx_adapter.js
          node --check scept-web/core/scept_data_adapter.js
          node --check scept-web/core/scept_observation.js
          node --check scept-web/core/scept_visual_data.js
          node --check scept-web/scept_visual_studio.js
          node --check scept-web/tests/u8_visual_contract.cjs
          node --check scept-web/tests/u8_visual_browser.cjs
          node --check scept-web/core/scept_intervention.js
          node --check scept-web/core/scept_scheduler.js
          node --check scept-web/core/scept_xai.js
          node --check scept-web/core/scept_sdk.js
          node --check scept-web/core/scept_audit.js
          node --check scept-web/core/scept_performance.js
          node --check scept-web/scept_m3_console.js
          node --check scept-web/plugins/u9_method_evaluation_sdk_template.js
          node --check scept-web/tests/u9_m3_contract.cjs
          node --check scept-web/tests/u9_m3_browser.cjs
          node --check scept-web/plugins/m2_external_method_example.js
          node --check scept-web/tests/u7_xai_protocol.cjs
          node --check scept-web/tests/u7_m2_browser.cjs
          node --check scept-web/tests/u6_scheduler.cjs
          node --check scept-web/tests/u6_browser.cjs
          node --check scept-web/tests/u5_interventions.cjs
          node --check scept-web/tests/u5_browser.cjs
          node --check scept-web/tests/u3_u4_contract.cjs
          node --check scept-web/tests/u4_m1_cross_architecture.cjs
          node --check scept-web/universal.js
          node --check scept-web/app.js
          node --check scept-web/mri.js
          node --check scept-web/fixtures.js
          node --check scept-web/tests/browser.cjs
          python -m compileall -q scripts/expose_onnx_probes.py
      - name: Verify U1 universal plugin contracts and fail-closed scientific capability rules
        run: node scept-web/tests/u1_core_contract.cjs
      - name: U3/U4 strict typed tensor and dynamic architecture-independent observation contracts
        run: node scept-web/tests/u3_u4_contract.cjs
      - name: U5 deterministic noise, occlusion, replacement, paired matched controls and fail-closed mask contracts
        run: node scept-web/tests/u5_interventions.cjs
      - name: U6 task queue, intensity sweeps, deterministic random seeds, failed retry and cancellation
        run: node scept-web/tests/u6_scheduler.cjs
      - name: U7 XAI protocol/manifest evaluation and synthetic lesion-hypothesis fail-closed contracts
        run: node scept-web/tests/u7_xai_protocol.cjs
      - name: U8 dynamic real observation source, exact graph edges and actual paired 2D/3D input contract
        run: node scept-web/tests/u8_visual_contract.cjs
      - name: M3 trusted plugin SDK, content-hash evidence, real-engine replay and fail-closed performance contracts
        run: node scept-web/tests/u9_m3_contract.cjs
      - name: Install CPU model testing tools
        run: python -m pip install onnx onnxruntime pytest numpy
      - name: Generate and validate two NEW ONNX model architectures for U2
        run: |
          python scept-web/tests/generate_u2_fixture.py
          python scept-web/tests/generate_u8_fixture.py
          python scripts/expose_onnx_probes.py scept-web/tests/generated/u2_cnn.onnx scept-web/tests/generated/u5_cnn_mask.onnx --ablate conv_hidden
      - name: Numerical validation of real ONNX graph execution
        run: python -m pytest -q scept-web/tests/test_engineering_reference.py scept-web/tests/test_u5_internal_reference.py
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python -m http.server 8765 -d scept-web >/tmp/scept-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: M1 U4 real pretrained ViT and genuine CNN internal observation via identical universal core
        run: node scept-web/tests/u4_m1_cross_architecture.cjs
      - name: U5 real Chromium A/B/C four input intervention plugins plus true instrumented hidden-layer mask
        run: node scept-web/tests/u5_browser.cjs
      - name: U6 real Chrome ONNX scheduler A/B intensity scan, seeded replay and A/B/C batch failures
        run: node scept-web/tests/u6_browser.cjs
      - name: M2 real browser ONNX import of external XAI experiment JSON with target/method/evaluation and lesion mask
        run: node scept-web/tests/u7_m2_browser.cjs
      - name: U8 real Chrome experimental-data-driven 3D graph, arbitrary CNN Token and input MRI/volume slices across U5 U6 U7
        run: node scept-web/tests/u8_visual_browser.cjs
      - name: M3 final real Chromium ONNX SDK, audit-file integrity/tamper and true U6/U7 replay acceptance
        run: node scept-web/tests/u9_m3_browser.cjs
      - name: U2 generic ONNX real MLP/CNN model import plus matching true probes
        run: node scept-web/tests/u2_generic_adapter.cjs
      - name: U2 deployed Universal Core acceptance with TWO unseen model architectures
        env:
          SCEPT_U2_URL: https://brainmirror-observatory-kv4d70v82-jayson-s-projects6.vercel.app/universal.html
        run: node scept-web/tests/u2_generic_adapter.cjs
      - name: U2 real frozen pretrained ViT and CNN run using the SAME generic registry
        run: node scept-web/tests/u2_pretrained_generic.cjs
      - name: Check Token A/B/Δ visual density with real MRI (screenshot-based acceptance)
        run: node scept-web/tests/v31_token_visual_clarity.cjs
      - name: Verify actual deployed A/B visual fix using Chromium and pretrained model
        env:
          SCEPT_V31_VISUAL_URL: https://brainmirror-observatory-du60leoc3-jayson-s-projects6.vercel.app/v3.html
        run: node scept-web/tests/v31_token_visual_clarity.cjs
      - name: Retain Token visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scept-token-visual-clarity
          path: /tmp/scept-v31-*.png
          if-no-files-found: ignore
      - name: Verify SCEPT v3.1 actual Token/channel fine-grained 3D and input Patch end to end
        run: node scept-web/tests/v31_token_mri.cjs
      - name: Verify additional real Query Key Patch Attention and Residual tensor probes
        run: node scept-web/tests/v31_extra_outputs.cjs
      - name: Verify deployed SCEPT v3.1 preview by real remote Chromium visit
        env:
          SCEPT_V31_URL: https://brainmirror-observatory-434y4izbp-jayson-s-projects6.vercel.app/v3.html
        run: node scept-web/tests/v31_token_mri.cjs
      - name: Discover additional exposed true ViT Q K and representation observation probes
        continue-on-error: true
        run: node scept-web/tests/v31_probe_discovery.cjs
      - name: Chrome CPU/WASM, MRI and audit end-to-end test
        run: node scept-web/tests/browser.cjs
      - name: Verify genuine 3D ONNX topology navigation, orbit, zoom and per-layer dependency drilldown
        run: node scept-web/tests/v3_network3d.cjs
      - name: Verify genuine 3D A/B MRI activity, fixed scales, changed ROI and zero-delta controls
        run: node scept-web/tests/v3_activation_compare.cjs

      - name: Verify SCEPT v3 real public MRI atlas and genuine ViT multi-layer mechanism response
        run: node scept-web/tests/v3_brain_mri.cjs
      - name: Verify true MRI-trained EfficientNetB3 paired NIfTI ROI response in browser
        run: node scept-web/tests/v3_mri_cnn.cjs
      - name: Probe MRI-trained EfficientNet B3 model browser feasibility (non-blocking research)
        continue-on-error: true
        run: node scept-web/tests/mri_trained_model_check.cjs
      - name: Chinese SCEPT simplified UI, ROI real ViT and responsive acceptance
        run: node scept-web/tests/chinese_studio.cjs
      - name: Verify deployed Chinese SCEPT studio on real Vercel preview
        env:
          SCEPT_STUDIO_URL: https://brainmirror-observatory-cfsp7x5vb-jayson-s-projects6.vercel.app
        run: node scept-web/tests/chinese_studio.cjs
      - name: Responsive Chromebook layout across viewport widths and pretrained ViT
        run: node scept-web/tests/responsive_layout.cjs
      - name: Two externally pretrained architectures (ViT / CNN), verified SHA-256, Chrome CPU
        run: node scept-web/tests/pretrained_models.cjs
      - name: Instrument actual pretrained transformer middle-layer probes without training
        run: python scept-web/tests/instrument_pretrained_vit.py
      - name: Verify real pretrained Transformer intermediate activations with browser CPU
        run: node scept-web/tests/pretrained_probes.cjs
      - name: Verify one-click pretrained Transformer demo needs no user uploads
        run: node scept-web/tests/transformer_one_click.cjs
      - name: Confirm one-click Transformer on actual Vercel preview deployment
        env:
          SCEPT_TEST_URL: https://brainmirror-observatory-5s7sb6ng5-jayson-s-projects6.vercel.app
        run: node scept-web/tests/transformer_one_click.cjs
      - name: Live one-link Transformer autostart, no files and no clicks
        env:
          SCEPT_TEST_URL: https://brainmirror-observatory-5s7sb6ng5-jayson-s-projects6.vercel.app
          SCEPT_TEST_AUTOSTART: '1'
        run: node scept-web/tests/transformer_one_click.cjs
