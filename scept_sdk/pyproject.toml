[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scept-research"
version = "0.2.0a5"
description = "SCEPT NAF single-forward observation and controlled numeric U10, research SDK A0-A5"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SCEPT contributors"}]
dependencies = ["numpy>=1.24,<3"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
all = ["torch>=2.1", "onnx>=1.15", "onnxruntime>=1.17"]
test = ["pytest>=7", "torch>=2.1", "onnx>=1.15", "onnxruntime>=1.17"]

[tool.setuptools]
packages = ["scept"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
